<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="acG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes latido {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px #EF4444b3); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 30px #10B981); }
    }
    .fondo  { fill: url(#bgG); }
    .titulo { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 40px;
               fill: url(#acG); animation: latido 3.5s infinite ease-in-out; }
    .sub    { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 14px;
               fill: #94A3B8; letter-spacing: 3px; }
    .chapa  { fill: #0F172A; stroke-width: 1.5; rx: 6px; }
    .ctexto { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  </style>

  <rect class="fondo" width="920" height="300" rx="14" stroke="#EF4444" stroke-width="1.5" />

  <g transform="translate(460, 95)" filter="url(#glowF)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <!-- Planeta Tierra con mitad fuego y mitad verde -->
      <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="url(#acG)" stroke-width="3.5"/>
      <path d="M 0 -38 A 38 38 0 0 1 0 38 Z" fill="#EF4444" opacity="0.4"/>
      <path d="M 0 38 A 38 38 0 0 1 0 -38 Z" fill="#10B981" opacity="0.4"/>
      <!-- Termómetro / Hoja -->
      <line x1="-12" y1="-20" x2="-12" y2="20" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-12" cy="20" r="6" fill="#EF4444"/>
      <path d="M 12 -18 C 22 -6 22 14 12 22 C 2 14 2 -6 12 -18 Z" fill="#10B981"/>
    </g>
  </g>

  <text x="460" y="185" text-anchor="middle" class="titulo">GLOBALWARMING</text>
  <text x="460" y="215" text-anchor="middle" class="sub">SLIMEFUN4 ADDON · IMPACTO AMBIENTAL Y CONTAMINACIÓN</text>

  <g transform="translate(240, 245)">
    <rect x="0" y="0" width="145" height="30" class="chapa" stroke="#EF4444" />
    <text x="12" y="20" class="ctexto" fill="#EF4444">DRAKES LABS</text>

    <rect x="165" y="0" width="135" height="30" class="chapa" stroke="#38BDF8" />
    <text x="177" y="20" class="ctexto" fill="#38BDF8">PAPER 1.21.11</text>

    <rect x="320" y="0" width="120" height="30" class="chapa" stroke="#A3E635" />
    <text x="332" y="20" class="ctexto" fill="#A3E635">JAVA 21</text>
  </g>
</svg>
